<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      const basePath = '/cchess/';
      const path = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length - 1)
        : '/';
      const search = window.location.search
        ? `&${window.location.search.slice(1)}`
        : '';

      window.location.replace(`${basePath}?redirect=${encodeURIComponent(path)}${search}${window.location.hash}`);
    </script>
  </body>
</html>
