name: Deploy Client to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Determine Vite base path
        id: base-path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$repo_name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: AIzaSyArjC_4QzwAhVPxhqt-dHK40R5hyEqMxPw
          VITE_FIREBASE_AUTH_DOMAIN: cchess-488bd.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://cchess-488bd-default-rtdb.asia-southeast1.firebasedatabase.app/
          VITE_FIREBASE_PROJECT_ID: cchess-488bd
          VITE_FIREBASE_APP_ID: 1:154668755946:web:2e3ac5ec6f7d9e387ce093
          VITE_FIREBASE_STORAGE_BUCKET: cchess-488bd.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 154668755946
          VITE_ENABLE_APPCHECK: true
          VITE_FIREBASE_APPCHECK_SITE_KEY: 6Leuz-csAAAAACUjHAYWamojDZutYc1T5JotGokZ
          VITE_BASE_PATH: ${{ steps.base-path.outputs.value }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
